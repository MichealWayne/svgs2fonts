name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '16' }
          - { os: ubuntu-latest, node: '22' }
          - { os: ubuntu-latest, node: '24' }
          - { os: macos-latest, node: '22' }
          - { os: windows-latest, node: '22' }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      # Filesystem fault/symlink tests run on Linux; all systems verify the real package.
      - run: npm test -- --silent
        if: runner.os == 'Linux'
      - run: npm run test:runtime
      - run: npm run test:package

  preview:
    name: Preview / desktop and mobile browser projects
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            browser-tests/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix browser-tests --ignore-scripts --no-audit --no-fund
      - run: npm --prefix browser-tests run install:browsers -- --with-deps
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-report
          path: |
            browser-tests/playwright-report/
            browser-tests/test-results/
          retention-days: 7
